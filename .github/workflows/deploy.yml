name: CI/CD - Automated Tests & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    name: Run 870+ Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ libomp-dev python3

      - name: Set up Node.js for the web workshop tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build All Engines & Run Master Test Suite
        run: |
          make test

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CS_INTERACTIVE_WORKSHOP }}
          channelId: live
          projectId: cs-interactive-workshop
