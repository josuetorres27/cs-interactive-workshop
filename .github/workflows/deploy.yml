name: CI/CD - Automated Tests & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: true

jobs:
  test:
    name: Run 1,376 Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (only if missing)
        run: |
          # GitHub runners already ship gcc, g++, make and python3 (gcc brings OpenMP).
          # Only touch apt when something is missing, so a mirror outage cannot block the deploy.
          if command -v gcc >/dev/null && command -v g++ >/dev/null && command -v make >/dev/null && command -v python3 >/dev/null; then
            echo "Build tools already installed:"; gcc --version | head -1; python3 --version
          else
            sudo apt-get update -o Acquire::Retries=5
            sudo apt-get install -y -o Acquire::Retries=5 build-essential gcc g++ python3
          fi

      - name: Set up Node.js for the web workshop tests
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build All Engines & Run Master Test Suite
        run: |
          make test

  deploy-firebase:
    name: Deploy to Firebase Hosting
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to the live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CS_INTERACTIVE_WORKSHOP }}
          channelId: live
          projectId: cs-interactive-workshop
